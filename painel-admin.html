<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Painel Administrativo — Arquivo Sombrio</title>
    <link rel="icon" type="image/png" href="favicon-32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style-base-20260914.css?v=20260917-6">
    <link rel="stylesheet" href="css/style.css?v=20260917-6">
    <style>
        body {
            min-height: 100dvh;
            background: #080706;
        }

        #admin-panel-loading {
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 24px;
            color: #d8cfc2;
            text-align: center;
            font-family: "IBM Plex Mono", monospace;
        }

        #admin-panel-loading div {
            width: min(100%, 520px);
            padding: 32px 24px;
            border: 1px solid rgba(164, 19, 19, 0.6);
            background: #0b0908;
        }

        #admin-panel-loading a {
            color: #d8cfc2;
        }

        body.admin-dashboard-open #admin-panel-loading {
            display: none !important;
        }

        body.admin-dashboard-open #admin-manager.admin-manager-overlay.active {
            position: relative !important;
            inset: auto !important;
            display: block !important;
            width: 100% !important;
            height: auto !important;
            min-height: 100dvh !important;
            max-height: none !important;
            padding: max(12px, env(safe-area-inset-top)) 8px max(32px, env(safe-area-inset-bottom)) !important;
            overflow: visible !important;
            visibility: visible !important;
            opacity: 1 !important;
            background: #080706 !important;
        }

        body.admin-dashboard-open #admin-manager > .admin-manager {
            display: block !important;
            position: relative !important;
            width: min(100%, 1120px) !important;
            min-height: 420px !important;
            max-height: none !important;
            margin: 0 auto !important;
            overflow: visible !important;
            visibility: visible !important;
            opacity: 1 !important;
        }

        body.admin-dashboard-open #admin-manager-close {
            display: none !important;
        }
    </style>
</head>
<body>
    <main id="admin-panel-loading">
        <div>
            <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
            <p id="admin-panel-status">Abrindo a Central de Arquivo...</p>
        </div>
    </main>

    <script>
        window.ARQUIVO_ADMIN_CAPTCHA_ATIVO = true;
        window.ARQUIVO_ADMIN_PAINEL_DIRETO = true;

        window.addEventListener("DOMContentLoaded", async function () {
            var status = document.getElementById("admin-panel-status");

            try {
                var sessao = await obterSessaoAdminIsolada();

                if (!sessao) {
                    window.location.replace("admin.html?session=expirada");
                    return;
                }

                await abrirPainelAdmin(sessao);
            } catch (erro) {
                console.error("Falha ao abrir o painel administrativo.", erro);
                if (status) {
                    status.innerHTML = "Não foi possível montar o painel.<br><br><a href=\"admin.html\">Voltar ao acesso administrativo</a>";
                }
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0" data-arquivo-sombrio-supabase="true" defer></script>
    <script src="js/admin-auth.js?v=20260918-14" defer></script>
    <script src="data/caso.js" defer></script>
    <script src="js/script.js?v=20260918-14" defer></script>
    <script src="js/admin-literario.js?v=20260917-7" defer></script>
    <script src="js/admin-core-tabs.js?v=20260917-7" defer></script>
</body>
</html>
