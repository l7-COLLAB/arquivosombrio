<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Painel Administrativo — Arquivo Sombrio</title>
    <link rel="icon" type="image/png" href="favicon-32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style-base-20260914.css?v=20260917-6">
    <link rel="stylesheet" href="css/style.css?v=20260918-17">
    <link rel="stylesheet" href="css/admin-dashboard.css?v=20260918-1">
    <style>
        body {
            min-height: 100dvh;
            background: #080706;
        }

        #admin-panel-loading {
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 24px;
            color: #d8cfc2;
            text-align: center;
            font-family: "IBM Plex Mono", monospace;
        }

        #admin-panel-loading div {
            width: min(100%, 520px);
            padding: 32px 24px;
            border: 1px solid rgba(164, 19, 19, 0.6);
            background: #0b0908;
        }

        #admin-panel-loading a {
            color: #d8cfc2;
        }

        body.admin-dashboard-open #admin-panel-loading {
            display: none !important;
        }

        body.admin-dashboard-open #admin-manager.admin-manager-overlay.active {
            position: relative !important;
            inset: auto !important;
            display: block !important;
            width: 100% !important;
            height: auto !important;
            min-height: 100dvh !important;
            max-height: none !important;
            padding: max(12px, env(safe-area-inset-top)) 8px max(32px, env(safe-area-inset-bottom)) !important;
            overflow: visible !important;
            visibility: visible !important;
            opacity: 1 !important;
            background: #080706 !important;
        }

        body.admin-dashboard-open #admin-manager > .admin-manager {
            display: block !important;
            position: relative !important;
            width: min(100%, 1120px) !important;
            min-height: 420px !important;
            max-height: none !important;
            margin: 0 auto !important;
            overflow: visible !important;
            visibility: visible !important;
            opacity: 1 !important;
        }

        body.admin-dashboard-open #admin-manager-close {
            position: absolute !important;
            top: 18px !important;
            right: 18px !important;
            z-index: 10 !important;
            display: grid !important;
            width: 42px !important;
            height: 42px !important;
            place-items: center !important;
            border: 1px solid rgba(181, 157, 122, 0.3) !important;
            background: #0b0908 !important;
            color: #cfc4b6 !important;
            font-size: 1.35rem !important;
            cursor: pointer !important;
        }

        body.admin-dashboard-open #admin-manager-close:hover,
        body.admin-dashboard-open #admin-manager-close:focus-visible {
            border-color: #a91c1c !important;
            background: #7c1010 !important;
            color: #fff !important;
        }

        @media (max-width: 760px) {
            body.admin-dashboard-open #admin-manager-close {
                position: fixed !important;
                top: max(10px, env(safe-area-inset-top)) !important;
                right: 10px !important;
            }
        }
    </style>
</head>
<body>
    <main id="admin-panel-loading">
        <div>
            <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
            <p id="admin-panel-status">Abrindo a Central de Arquivo...</p>
        </div>
    </main>

    <script>
        window.ARQUIVO_ADMIN_CAPTCHA_ATIVO = true;
        window.ARQUIVO_ADMIN_PAINEL_DIRETO = true;

        document.addEventListener("click", function (evento) {
            var fechar = evento.target.closest("#admin-manager-close");
            if (!fechar) return;

            evento.preventDefault();
            evento.stopImmediatePropagation();
            window.location.href = "index.html";
        }, true);

        (async function iniciarPainelAdministrativo() {
            var status = document.getElementById("admin-panel-status");

            function atualizar(texto) {
                if (status) status.textContent = texto;
            }

            function carregarScript(nome, endereco, prazo) {
                return new Promise(function (resolver, rejeitar) {
                    var concluido = false;
                    var script = document.createElement("script");
                    var temporizador = window.setTimeout(function () {
                        if (concluido) return;
                        concluido = true;
                        script.remove();
                        rejeitar(new Error(nome + " demorou demais para carregar."));
                    }, prazo || 15000);

                    script.src = endereco;
                    script.async = false;
                    script.onload = function () {
                        if (concluido) return;
                        concluido = true;
                        window.clearTimeout(temporizador);
                        resolver();
                    };
                    script.onerror = function () {
                        if (concluido) return;
                        concluido = true;
                        window.clearTimeout(temporizador);
                        rejeitar(new Error("Não foi possível carregar " + nome + "."));
                    };

                    document.head.appendChild(script);
                });
            }

            try {
                atualizar("Preparando a autenticação...");
                await carregarScript(
                    "a autenticação do Supabase",
                    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0",
                    15000
                );
                await carregarScript(
                    "a sessão administrativa",
                    "js/admin-auth.js?v=20260918-16",
                    12000
                );

                atualizar("Validando a sessão administrativa...");
                var sessao = await obterSessaoAdminIsolada();

                if (!sessao) {
                    window.location.replace("admin.html?session=expirada");
                    return;
                }

                atualizar("Carregando os dados do arquivo...");
                await carregarScript("os dados editoriais", "data/caso.js?v=20260918-16", 12000);
                await carregarScript("o painel principal", "js/script.js?v=20260923-agendado-2", 20000);

                atualizar("Carregando o editor literário...");
                await carregarScript(
                    "o editor de lendas e creepypastas",
                    "js/admin-literario.js?v=20260923-agendado-1",
                    12000
                );

                atualizar("Preparando a central administrativa...");
                await carregarScript(
                    "a central administrativa",
                    "js/admin-dashboard.js?v=20260918-1",
                    12000
                );

                if (typeof abrirPainelAdmin !== "function") {
                    throw new Error("A função principal do painel não ficou disponível.");
                }

                atualizar("Montando a Central de Arquivo...");
                await abrirPainelAdmin(sessao);
            } catch (erro) {
                console.error("Falha ao abrir o painel administrativo.", erro);
                if (status) {
                    status.innerHTML =
                        String(erro && erro.message ? erro.message : "Não foi possível montar o painel.") +
                        '<br><br><a href="admin.html?retry=1">Voltar e tentar novamente</a>';
                }
            }
        })();
    </script>
</body>
</html>
