<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#080706">
  <title>Arquivo Sombrio | Prévia internacional</title>
  <style>
    :root{color-scheme:dark;--bg:#080706;--paper:#e8dcc1;--muted:#b3a892;--line:#5b4738;--accent:#bd8359}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 5%,#281b17 0,transparent 42%),var(--bg);color:var(--paper);font:16px/1.75 Georgia,serif}
    main{max-width:820px;min-height:100vh;padding:clamp(24px,5vw,74px) 24px;margin:auto}
    .eyebrow,.controls,.notice,.foot{font:12px/1.6 system-ui,sans-serif;letter-spacing:.09em}
    .eyebrow{color:var(--accent);text-transform:uppercase}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:36px 0}
    label{color:var(--muted)}select{color:var(--paper);background:#211916;border:1px solid var(--line);border-radius:4px;padding:12px;font:inherit;min-width:220px}
    h1{font-size:clamp(35px,6vw,64px);font-weight:500;line-height:1.12;margin:38px 0 16px;letter-spacing:.02em}
    h2{font-size:clamp(22px,3vw,31px);line-height:1.35;font-weight:normal;color:var(--accent);margin:24px 0}
    p.intro{font-size:clamp(17px,2.3vw,21px);line-height:1.85;max-width:67ch}
    .rule{border:0;border-top:1px solid var(--line);margin:32px 0}
    .notice{border-left:2px solid var(--accent);background:rgba(189,131,89,.06);padding:15px 18px;color:var(--muted);letter-spacing:normal}
    a{color:var(--paper);text-decoration:underline;text-underline-offset:4px}
    a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
    .foot{color:var(--muted);margin-top:55px;letter-spacing:normal}
  </style>
</head>
<body>
<main>
  <div class="eyebrow" id="stage">Arquivo Sombrio · Prévia editorial · Fase 6.3</div>
  <div class="controls"><label for="locale">Idioma / Language / Langue</label>
    <select id="locale" aria-label="Selecionar idioma de prévia" disabled><option value="pt-BR">Português (Brasil)</option></select>
  </div>
  <article aria-live="polite" aria-atomic="true">
    <h1 id="title">Arquivo Sombrio</h1>
    <h2 id="tagline">Introduções editoriais</h2>
    <hr class="rule">
    <p class="intro" id="intro">Carregando prévia editorial…</p>
  </article>
  <p id="notice" class="notice">Esta é uma prévia interna. As páginas internacionais e seus dossiês ainda não estão publicados.</p>
  <p class="foot"><a href="../index.html" id="back">Voltar ao site em português (Brasil)</a></p>
</main>
<script>
(function(){
  'use strict';
  var select=document.getElementById('locale');
  var notice=document.getElementById('notice');
  var back=document.getElementById('back');
  var copy={
    'pt-BR':{notice:'Esta é uma prévia editorial. As páginas internacionais e seus dossiês ainda não estão publicados.',back:'Voltar ao site em português (Brasil)',error:'Não foi possível carregar as introduções.'},
    'en-US':{notice:'Editorial preview only. International pages and case files are not yet published.',back:'Visit the main website (Portuguese — Brazil)',error:'Unable to load the introductions.'},
    'es-ES':{notice:'Vista previa editorial. Las páginas internacionales y sus expedientes todavía no están publicados.',back:'Visitar el sitio principal (portugués de Brasil)',error:'No se han podido cargar las introducciones.'},
    'fr-FR':{notice:'Aperçu éditorial uniquement. Les pages internationales et leurs dossiers ne sont pas encore publiés.',back:'Consulter le site principal (portugais du Brésil)',error:'Impossible de charger les introductions.'}
  };
  var requested=new URLSearchParams(location.search).get('lang');
  var config=null;
  var locale='pt-BR';
  var entries=null;
  function supported(code){return config&&config.locales.some(function(x){return x.code===code})}
  function resolve(code){return supported(code)?code:config.defaultLocale}
  function render(){
    if(!config)return;
    var t=copy[locale]||copy['pt-BR'];
    document.documentElement.lang=locale;
    select.value=locale;
    select.setAttribute('aria-label','Idioma / Language / Langue');
    notice.textContent=t.notice;
    back.textContent=t.back;
    if(!entries||!entries[locale]||!['title','tagline','intro'].every(function(k){return typeof entries[locale][k]==='string'&&entries[locale][k].trim()})){
      document.getElementById('title').textContent='Arquivo Sombrio';
      document.getElementById('tagline').textContent='';
      document.getElementById('intro').textContent=t.error;
      document.title='Arquivo Sombrio | Preview';
      return;
    }
    var d=entries[locale];
    ['title','tagline','intro'].forEach(function(key){document.getElementById(key).textContent=d[key]});
    document.title=d.title+' | '+d.tagline;
  }
  function choose(code,push){
    locale=resolve(code);
    if(push){
      var url=new URL(location.href);
      url.searchParams.set('lang',locale);
      history.pushState(null,'',url.pathname+url.search+url.hash);
    }
    render();
  }
  select.addEventListener('change',function(){choose(select.value,true)});
  window.addEventListener('popstate',function(){if(config)choose(new URLSearchParams(location.search).get('lang'),false)});
  Promise.all([
    fetch('../i18n/config-internacional.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw Error('Config HTTP '+r.status);return r.json()}),
    fetch('../i18n/introducoes.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw Error('Intro HTTP '+r.status);return r.json()})
  ]).then(function(results){
    var settings=results[0],introductions=results[1];
    if(!settings||settings.status!=='draft'||!Array.isArray(settings.locales)||!settings.locales.length||!settings.defaultLocale)throw Error('Invalid config');
    if(!introductions||introductions.status!=='draft'||!introductions.locales)throw Error('Invalid introductions');
    config=settings;
    entries=introductions.locales;
    select.textContent='';
    settings.locales.forEach(function(l){
      if(!copy[l.code])return;
      var option=document.createElement('option');
      option.value=l.code;option.textContent=l.nativeName;
      select.appendChild(option);
    });
    select.disabled=false;
    choose(requested,false);
  }).catch(function(){
    config={defaultLocale:'pt-BR',locales:[{code:'pt-BR',nativeName:'Português (Brasil)'}]};
    locale='pt-BR';
    render();
  });
})();
</script>
</body>
</html>
