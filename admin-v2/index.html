<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Central Administrativa V2 | Arquivo Sombrio</title><link rel="stylesheet" href="./css/admin-v2.css"></head><body>
<section id="admin-v2-login" class="admin-login-screen"><form id="admin-v2-login-form" class="admin-login-card"><small>ARQUIVO SOMBRIO · ACESSO RESTRITO</small><h1>Central Administrativa</h1><p>Admin V2 Essencial. Use a conta administrativa do Arquivo Sombrio.</p><label>E-mail<input id="admin-v2-email" type="email" autocomplete="username" required></label><label>Senha<input id="admin-v2-password" type="password" autocomplete="current-password" required></label><div class="admin-captcha-area"><div id="admin-v2-turnstile" class="cf-turnstile" data-sitekey="0x4AAAAAAEnNLBi2BDt_aJkF" data-theme="dark" data-language="pt-br" data-callback="adminV2CaptchaOk" data-expired-callback="adminV2CaptchaReset" data-error-callback="adminV2CaptchaReset"></div><small id="admin-v2-captcha-status">Conclua a verificação de segurança.</small></div><button id="admin-v2-login-button" type="submit" disabled>Entrar</button><div id="admin-v2-login-message" class="admin-login-message" aria-live="polite"></div></form></section>
<div id="admin-v2-app" class="admin-app" hidden><aside class="admin-sidebar"><div class="admin-brand"><small>ARQUIVO SOMBRIO</small><strong>Central Administrativa</strong><span>V2 · Essencial</span></div><nav id="admin-v2-nav"></nav><button id="admin-v2-logout" class="admin-logout" type="button">Sair</button></aside><main class="admin-main"><header class="admin-topbar"><div><small>Central Administrativa</small><h1 id="admin-v2-title">Visão geral</h1></div><div class="admin-environment">ADMIN V2 ESSENCIAL</div></header><section id="admin-v2-view" class="admin-view" aria-live="polite"></section></main></div>
<script>window.ADMIN_V2_CAPTCHA_TOKEN="";window.adminV2CaptchaOk=t=>{window.ADMIN_V2_CAPTCHA_TOKEN=t;const b=document.getElementById("admin-v2-login-button");if(b)b.disabled=false;const s=document.getElementById("admin-v2-captcha-status");if(s)s.textContent="Verificação concluída."};window.adminV2CaptchaReset=()=>{window.ADMIN_V2_CAPTCHA_TOKEN="";const b=document.getElementById("admin-v2-login-button");if(b)b.disabled=true;const s=document.getElementById("admin-v2-captcha-status");if(s)s.textContent="Faça a verificação novamente."};</script><script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script><script type="module" src="./js/app.js"></script></body></html>
