<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Painel Administrativo V2 — Arquivo Sombrio</title>
<link rel="icon" type="image/png" href="../favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="./legacy/css/style-base.css?v=clone-1">
<link rel="stylesheet" href="./legacy/css/style.css?v=clone-1">
<link rel="stylesheet" href="./legacy/css/admin-dashboard.css?v=responsive-security-1">
<style>
body{min-height:100dvh;background:#080706}
#admin-panel-loading{min-height:100dvh;display:grid;place-items:center;padding:24px;color:#d8cfc2;text-align:center;font-family:"IBM Plex Mono",monospace}
#admin-panel-loading div{width:min(100%,520px);padding:32px 24px;border:1px solid rgba(164,19,19,.6);background:#0b0908}
#admin-panel-loading a{color:#d8cfc2}
body.admin-dashboard-open #admin-panel-loading{display:none!important}
body.admin-dashboard-open #admin-manager.admin-manager-overlay.active{position:relative!important;inset:auto!important;display:block!important;width:100%!important;height:auto!important;min-height:100dvh!important;max-height:none!important;padding:max(12px,env(safe-area-inset-top)) 8px max(32px,env(safe-area-inset-bottom))!important;overflow:visible!important;visibility:visible!important;opacity:1!important;background:#080706!important}
body.admin-dashboard-open #admin-manager>.admin-manager{display:block!important;position:relative!important;width:min(100%,1120px)!important;min-height:420px!important;max-height:none!important;margin:0 auto!important;overflow:visible!important;visibility:visible!important;opacity:1!important}
body.admin-dashboard-open #admin-manager-close{position:absolute!important;top:18px!important;right:18px!important;z-index:10!important;display:grid!important;width:42px!important;height:42px!important;place-items:center!important;border:1px solid rgba(181,157,122,.3)!important;background:#0b0908!important;color:#cfc4b6!important;font-size:1.35rem!important;cursor:pointer!important}
body.admin-dashboard-open #admin-manager-close:hover,body.admin-dashboard-open #admin-manager-close:focus-visible{border-color:#a91c1c!important;background:#7c1010!important;color:#fff!important}
@media(max-width:760px){body.admin-dashboard-open #admin-manager-close{position:fixed!important;top:max(10px,env(safe-area-inset-top))!important;right:10px!important}}
</style>
</head>
<body>
<main id="admin-panel-loading"><div><i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i><p id="admin-panel-status">Abrindo a Central de Arquivo...</p></div></main>
<script>
window.ARQUIVO_ADMIN_CAPTCHA_ATIVO=true;
window.ARQUIVO_ADMIN_PAINEL_DIRETO=true;
window.ARQUIVO_ADMIN_V2_CLONE=true;
document.addEventListener("click",function(e){var f=e.target.closest("#admin-manager-close");if(!f)return;e.preventDefault();e.stopImmediatePropagation();window.location.href="../index.html"},true);
(async function(){var status=document.getElementById("admin-panel-status");function set(t){if(status)status.textContent=t}function load(name,url,timeout){return new Promise(function(ok,fail){var done=false,s=document.createElement("script"),timer=setTimeout(function(){if(done)return;done=true;s.remove();fail(new Error(name+" demorou demais para carregar."))},timeout||15000);s.src=url;s.async=false;s.onload=function(){if(done)return;done=true;clearTimeout(timer);ok()};s.onerror=function(){if(done)return;done=true;clearTimeout(timer);fail(new Error("Não foi possível carregar "+name+"."))};document.head.appendChild(s)})}
try{
set("Preparando a autenticação...");
await load("a autenticação do Supabase","https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0",15000);
await load("a sessão administrativa","./legacy/js/admin-auth.js?v=security-1",12000);
set("Validando a sessão administrativa...");
var sessao=await obterSessaoAdminIsolada();
var verifiedAt=Number(sessionStorage.getItem("arquivo-admin-verified-at")||0);
var verifiedUser=sessionStorage.getItem("arquivo-admin-verified-user")||"";
var verificationFresh=verifiedAt>0&&(Date.now()-verifiedAt)<30*60*1000;
if(!sessao||!verificationFresh||verifiedUser!==String(sessao.user.id)){
    sessionStorage.removeItem("arquivo-admin-verified-at");
    sessionStorage.removeItem("arquivo-admin-verified-user");
    window.location.replace("../admin.html?session=verificacao&next=adm");
    return
}
set("Carregando os dados do arquivo...");
await load("os dados editoriais","./legacy/data/caso.js?v=clone-1",12000);
await load("o painel principal","./legacy/js/script.js?v=agendado-4",20000);
await load("os controles V2 de Dossiês","./legacy/js/v2-dossie.js?v=agendado-4",12000);
await load("os controles V2 do Garimpo","./legacy/js/v2-garimpo.js?v=agendado-4",12000);
set("Carregando o editor literário...");
await load("o editor de lendas e creepypastas","./legacy/js/admin-literario.js?v=schedule-center-2",12000);
set("Preparando a narração do arquivo...");
await load("o módulo de narração","./js/narration.js?v=polly-4",12000);
set("Preparando a central administrativa...");
await load("a central administrativa","./legacy/js/admin-dashboard.js?v=polly-4",12000);
if(typeof abrirPainelAdmin!=="function")throw new Error("A função principal do painel não ficou disponível.");
set("Montando a Central de Arquivo...");
await abrirPainelAdmin(sessao);
}catch(err){console.error("Falha ao abrir o painel V2 clonado.",err);if(status)status.innerHTML=String(err&&err.message?err.message:"Não foi possível montar o painel.")+'<br><br><a href="../admin.html?retry=1">Voltar e tentar novamente</a>'}
})();
</script>
</body>
</html>
