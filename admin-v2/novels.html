<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Novels · Admin V2</title><link rel="stylesheet" href="../css/novels.css?v=1"><style>body{padding:20px}.admin-novel{width:min(1050px,100%);margin:auto}.admin-novel form{display:grid;gap:12px}.admin-novel input,.admin-novel textarea,.admin-novel select{width:100%;padding:12px;background:#11100e;border:1px solid rgba(216,201,173,.16);color:#eee}.admin-novel textarea{min-height:130px}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.admin-list{margin-top:28px;border-top:1px solid rgba(216,201,173,.16)}.admin-row{padding:14px 0;border-bottom:1px solid rgba(216,201,173,.12)}@media(max-width:650px){.admin-grid{grid-template-columns:1fr}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0" defer></script><script src="./js/novels-admin.js?v=editor-3" defer></script></head><body class="novels"><main class="admin-novel"><a class="novel-home" href="./index.html">← Central Administrativa</a><p class="novel-kicker">EDITORIAL</p><h1>Novels</h1><p>Cadastre obras e capítulos. Publicação permanece sob controle administrativo.</p><section class="admin-list" id="existing-novels"><h2>Obras cadastradas</h2><p id="novel-feedback" role="status"></p><div id="admin-novel-list">Carregando obras...</div></section><section id="novel-create"><details><summary style="padding:18px;border:1px solid #52443a;cursor:pointer;font-size:1.2rem">+ Cadastrar nova obra</summary><h2>Nova obra</h2><form id="novel-form"><div class="admin-grid"><input name="titulo" required placeholder="Título"><input name="autor_nome" required placeholder="Autor"></div><input name="slug" required placeholder="slug-da-obra"><input name="generos" placeholder="Gêneros separados por vírgula"><label>Capa da obra<input id="novel-cover-file" name="capa_arquivo" type="file" accept="image/jpeg,image/png,image/webp"><small>JPEG, PNG ou WebP · máximo 8 MB</small></label><img id="novel-cover-preview" alt="Prévia da capa" hidden style="width:140px;aspect-ratio:2/3;object-fit:cover;border:1px solid rgba(216,201,173,.16)"><textarea name="sinopse" required placeholder="Sinopse"></textarea><select name="status_publicacao"><option value="rascunho">Rascunho</option><option value="publicado">Publicado</option></select><button class="novel-button">Salvar obra</button></form></details></section><section id="work-editor" hidden><h2>Editar obra</h2><form id="work-form"><input type="hidden" name="id"><label>Título<input name="titulo" required></label><label>Autor<input name="autor_nome" required></label><label>Gêneros<input name="generos"></label><label>Sinopse<textarea name="sinopse" required></textarea></label><label>Status<select name="status_publicacao"><option value="rascunho">Rascunho</option><option value="revisao">Revisão</option><option value="agendado">Agendado</option><option value="publicado">Publicado</option><option value="arquivado">Arquivado</option></select></label><button class="novel-button">Salvar alterações</button></form></section><section id="chapter-list-section" hidden><h2>Capítulos da obra</h2><div id="chapter-list"></div></section><section id="chapter-editor" hidden><h2 id="chapter-editor-title">Novo capítulo</h2><form id="chapter-form"><input type="hidden" name="novel_id"><input type="hidden" name="id"><div class="admin-grid"><input name="numero" type="number" min="1" required placeholder="Número"><input name="titulo" required placeholder="Título do capítulo"></div><textarea name="conteudo" required placeholder="Texto do capítulo"></textarea><select name="status_publicacao"><option value="rascunho">Rascunho</option><option value="publicado">Publicado</option></select><button class="novel-button">Salvar capítulo</button></form></section></main></body></html>
