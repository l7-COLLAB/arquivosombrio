<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Novels · Admin V2</title><link rel="stylesheet" href="../css/novels.css?v=1"><style>body{padding:20px}.admin-novel{width:min(1050px,100%);margin:auto}.admin-novel form{display:grid;gap:12px}.admin-novel input,.admin-novel textarea,.admin-novel select{width:100%;padding:12px;background:#11100e;border:1px solid rgba(216,201,173,.16);color:#eee}.admin-novel textarea{min-height:130px}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.admin-list{margin-top:28px;border-top:1px solid rgba(216,201,173,.16)}.admin-row{padding:14px 0;border-bottom:1px solid rgba(216,201,173,.12)}@media(max-width:650px){.admin-grid{grid-template-columns:1fr}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0" defer></script><script src="./js/novels-admin.js?v=1" defer></script></head><body class="novels"><main class="admin-novel"><a class="novel-home" href="./index.html">← Central Administrativa</a><p class="novel-kicker">EDITORIAL</p><h1>Novels</h1><p>Cadastre obras e capítulos. Publicação permanece sob controle administrativo.</p><section><h2>Nova obra</h2><form id="novel-form"><div class="admin-grid"><input name="titulo" required placeholder="Título"><input name="autor_nome" required placeholder="Autor"></div><input name="slug" required placeholder="slug-da-obra"><input name="generos" placeholder="Gêneros separados por vírgula"><input name="imagem_capa" placeholder="URL da capa"><textarea name="sinopse" required placeholder="Sinopse"></textarea><select name="status_publicacao"><option value="rascunho">Rascunho</option><option value="publicado">Publicado</option></select><button class="novel-button">Salvar obra</button></form></section><section class="admin-list"><h2>Obras</h2><div id="admin-novel-list">Carregando...</div></section><section id="chapter-editor" hidden><h2>Novo capítulo</h2><form id="chapter-form"><input type="hidden" name="novel_id"><div class="admin-grid"><input name="numero" type="number" min="1" required placeholder="Número"><input name="titulo" required placeholder="Título do capítulo"></div><textarea name="conteudo" required placeholder="Texto do capítulo"></textarea><select name="status_publicacao"><option value="rascunho">Rascunho</option><option value="publicado">Publicado</option></select><button class="novel-button">Salvar capítulo</button></form></section></main></body></html>
