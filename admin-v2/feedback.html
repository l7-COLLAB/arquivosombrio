<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Mensagens dos leitores | Administração</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0c0d10;color:#e8dac4;font:15px/1.5 system-ui}main{max-width:950px;padding:20px;margin:auto}h1{font:500 32px Georgia,serif}a{color:#d4bd90}select,button,textarea{background:#1d1d20;color:#ebdfce;border:1px solid #766955;border-radius:4px;padding:9px;font:inherit}button{cursor:pointer}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0}.item{padding:19px;margin:13px 0;background:#17181b;border:1px solid #645647;border-radius:5px;overflow-wrap:anywhere}.meta{font-size:12px;color:#c6b598}.msg{white-space:pre-wrap}.item textarea{width:100%;min-height:65px;margin:10px 0}.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.status{color:#d6c091}.error{color:#efb3a5}</style>
<link rel="stylesheet" href="./css/admin-controls.css?v=20261006-1">
</head><body><main><p><a href="index.html">← Voltar à Administração V2</a></p><h1>Mensagens dos leitores</h1><p>Feedbacks e problemas enviados pelo site. Acesso restrito à administração.</p><p id="global" role="status">Verificando acesso...</p><div id="app" hidden><div class="toolbar"><label for="filter">Filtrar:</label><select id="filter"><option value="todos">Todos</option><option value="novo">Novos</option><option value="em_analise">Em análise</option><option value="resolvido">Resolvidos</option><option value="arquivado">Arquivados</option></select><button id="reload" type="button">Atualizar</button><span id="count"></span></div><section id="list" aria-label="Mensagens recebidas"></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="./legacy/js/admin-auth.js?v=security-1"></script>
<script>(async function(){"use strict";
var global=document.getElementById("global"),app=document.getElementById("app"),list=document.getElementById("list"),client;
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
try{
var session=await obterSessaoAdminIsolada(),verifiedAt=Number(sessionStorage.getItem("arquivo-admin-verified-at")||0),verifiedUser=sessionStorage.getItem("arquivo-admin-verified-user")||"";
if(!session||verifiedUser!==String(session.user.id)||Date.now()-verifiedAt>1800000){location.replace("../admin.html?session=verificacao&next=adm");return;}
client=obterClienteAdminIsolado();app.hidden=false;global.textContent="Acesso autorizado.";
}catch(e){global.textContent="Acesso indisponível. Volte à Administração e confirme sua sessão.";return;}
async function load(){global.textContent="Consultando mensagens...";list.replaceChildren();
var q=client.from("visitor_messages").select("id,kind,category,message,source_url,contact_email,status,admin_note,created_at").order("created_at",{ascending:false}).limit(200);
if(document.getElementById("filter").value!=="todos")q=q.eq("status",document.getElementById("filter").value);
var r=await q;if(r.error){global.textContent="Erro ao carregar: "+r.error.message;global.className="error";return;}
global.textContent="Última consulta concluída.";document.getElementById("count").textContent=r.data.length+" registro(s)";if(!r.data.length){list.textContent="Nenhuma mensagem encontrada.";return;}
r.data.forEach(function(item){var card=document.createElement("article");card.className="item";var date=new Date(item.created_at).toLocaleString("pt-BR");
card.innerHTML='<div class="meta">'+esc(date)+' · '+(item.kind==="problem"?"PROBLEMA":"FEEDBACK")+' · '+esc(item.category)+'</div><p class="msg">'+esc(item.message)+'</p>'+(item.source_url?'<p class="meta">Página: <a target="_blank" rel="noopener noreferrer" href="'+esc(/^https?:\/\//i.test(item.source_url)?item.source_url:"#")+'">'+esc(item.source_url)+'</a></p>':"")+(item.contact_email?'<p class="meta">Contato: '+esc(item.contact_email)+'</p>':"")+'<div class="actions"><label>Situação <select class="state"><option value="novo">Novo</option><option value="em_analise">Em análise</option><option value="resolvido">Resolvido</option><option value="arquivado">Arquivado</option></select></label></div><label>Nota interna <textarea maxlength="2000"></textarea></label><button class="save" type="button">Salvar alteração</button> <span class="status" role="status"></span>';
card.querySelector(".state").value=item.status;card.querySelector("textarea").value=item.admin_note||"";
card.querySelector(".save").addEventListener("click",async function(){var btn=card.querySelector(".save"),status=card.querySelector(".status");btn.disabled=true;status.textContent="Salvando...";
var res=await client.from("visitor_messages").update({status:card.querySelector(".state").value,admin_note:card.querySelector("textarea").value}).eq("id",item.id);
status.textContent=res.error?"Falha: "+res.error.message:"Atualização salva.";btn.disabled=false;
});list.appendChild(card);});}
document.getElementById("reload").addEventListener("click",load);document.getElementById("filter").addEventListener("change",load);load();
})();</script></body></html>
