<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Corpos ensacados em São Paulo</title><desc id="desc">Capa tipográfica do Arquivo Sombrio. Caso em acompanhamento. Autoria comum não confirmada.</desc><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#221d18"/><stop offset="1" stop-color="#0d0b09"/></linearGradient><pattern id="lines" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8H8" stroke="#c4af8c" stroke-opacity=".025"/></pattern></defs><rect width="1200" height="675" fill="url(#paper)"/><rect width="1200" height="675" fill="url(#lines)"/><rect x="35" y="35" width="1130" height="605" fill="none" stroke="#69533e"/><path d="M70 115H1130M70 552H1130" stroke="#69533e"/><g fill="#bfa98a" font-family="Georgia,serif"><text x="70" y="87" font-size="24" letter-spacing="4">ARQUIVO SOMBRIO</text><text x="70" y="171" font-family="monospace" font-size="18" letter-spacing="3">GARIMPO SOMBRIO / SÃO PAULO</text><text x="70" y="270" font-size="65" font-weight="bold">CORPOS ENSACADOS</text><text x="70" y="346" font-size="65" font-weight="bold">EM SÃO PAULO</text><text x="70" y="421" font-size="32">Existe um assassino em série?</text><text x="70" y="480" font-family="monospace" font-size="20" fill="#a58e70">AUTORIA COMUM NÃO CONFIRMADA</text><text x="70" y="598" font-family="monospace" font-size="20" letter-spacing="2">CASO EM ACOMPANHAMENTO</text><text x="1130" y="598" text-anchor="end" font-family="monospace" font-size="17">SET / OUT 2026</text></g><rect x="70" y="523" width="95" height="3" fill="#84463a"/></svg>