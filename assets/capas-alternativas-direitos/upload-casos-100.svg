<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc"><title id="title">Jennifer Pan — arte editorial original</title><desc id="desc">Ilustração vetorial original e simbólica do Arquivo Sombrio, sem pessoa real, fotografia, imagem de terceiro ou vestígio do caso.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#22252d"/><stop offset="1" stop-color="#12151c"/></linearGradient><pattern id="lines" width="47" height="47" patternUnits="userSpaceOnUse"><path d="M47 0H0V47" fill="none" stroke="#bd8d75" opacity=".07"/></pattern></defs><rect width="900" height="1200" fill="url(#bg)"/><rect width="900" height="1200" fill="url(#lines)"/><rect x="40" y="40" width="820" height="1120" fill="none" stroke="#bd8d75" stroke-width="2" opacity=".65"/><text x="72" y="137" fill="#eddfce" font-size="37" font-family="Georgia,serif" letter-spacing="4">ARQUIVO SOMBRIO</text><path d="M72 164H828" stroke="#bd8d75" stroke-width="2"/><text x="72" y="216" fill="#bd8d75" font-size="22" font-family="Arial,sans-serif" letter-spacing="3">DOSSIÊ DOCUMENTAL</text><g transform="translate(450 400)"><path d="M-122-150H70L150-70V150H-122Z M70-150V-70H150 M-80-40H103 M-80 15H106 M-80 70H55" fill="none" stroke="#bd8d75" stroke-width="10" stroke-linejoin="round" opacity=".85"/></g><rect x="0" y="681" width="900" height="360" fill="#12151c" opacity=".93"/><path d="M72 727H182" stroke="#aa635a" stroke-width="8"/><text x="72" y="790" font-family="Georgia,serif" font-weight="bold" font-size="71" fill="#eddfce">Jennifer Pan</text><path d="M72 1065H828" stroke="#bd8d75" stroke-width="3" opacity=".85"/><text x="72" y="1103" font-family="Arial,sans-serif" font-size="17" fill="#bd8d75" letter-spacing="1">ILUSTRAÇÃO EDITORIAL · SEM RETRATO REAL</text><text x="72" y="1134" font-family="Arial,sans-serif" font-size="16" fill="#bd8d75" letter-spacing="1">NÃO É FOTOGRAFIA, DOCUMENTO OU EVIDÊNCIA</text></svg>
