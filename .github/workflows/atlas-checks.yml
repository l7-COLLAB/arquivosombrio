name: Atlas Criminal — verificações
on:
  pull_request:
    paths:
      - atlas.html
      - js/atlas-criminal.js
      - css/atlas-criminal.css
      - index.html
      - sitemap.xml
      - supabase/migrations/20261104173837_atlas_reservar_notas_editoriais_e_incluir_especiais.sql
      - tests/atlas-public.test.cjs
      - scripts/qa-atlas-production.py
      - tests/test_atlas_prod_qa.py
      - sql/atlas-criminal-localidades-20261104.sql
      - .github/workflows/atlas-checks.yml
  push:
    branches: [main]
    paths:
      - atlas.html
      - js/atlas-criminal.js
      - css/atlas-criminal.css
      - index.html
      - sitemap.xml
      - tests/atlas-public.test.cjs
      - scripts/qa-atlas-production.py
      - tests/test_atlas_prod_qa.py
jobs:
  atlas-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe JavaScript
        run: node --check js/atlas-criminal.js
      - name: Testar proteção de dados e pesquisa por cidade
        run: node --test tests/atlas-public.test.cjs
      - name: Testar homologação de produção sem rede
        run: python3 -m unittest discover -s tests -p 'test_atlas_prod_qa.py' -v
      - name: Validar HTML, links e sitemap
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import xml.etree.ElementTree as ET
          class Validator(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids=set()
                  self.links=set()
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if d.get('id'): self.ids.add(d['id'])
                  if d.get('href'): self.links.add(d['href'])
          page=Path('atlas.html').read_text(encoding='utf-8')
          nav=Path('index.html').read_text(encoding='utf-8')
          script=Path('js/atlas-criminal.js').read_text(encoding='utf-8')
          v=Validator()
          v.feed(page)
          required=['atlas-main','atlas-map','atlas-country','atlas-region','atlas-city',
                    'atlas-neighborhood','atlas-search','atlas-clear','atlas-viewport',
                    'atlas-list','atlas-count','atlas-feedback','atlas-filters','atlas-results']
          assert all(x in v.ids for x in required), 'Faltam elementos essenciais do atlas'
          assert '/css/atlas-criminal.css?v=2' in v.links
          assert 'href="atlas.html"' in nav, 'Sem acesso pelo menu inicial'
          assert 'case_atlas_public' in script and 'event_year' in script
          root=ET.parse('sitemap.xml').getroot()
          ns='{http://www.sitemaps.org/schemas/sitemap/0.9}'
          urls=[node.text for node in root.iter(ns+'loc')]
          assert urls.count('https://arquivosombrio.net.br/atlas.html')==1
          print('Atlas: HTML, rota, sitemap e campos OK')
          PY