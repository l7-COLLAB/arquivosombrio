name: Laboratório Forense — testes educativos

on:
  pull_request:
    paths:
      - "laboratorio-forense.html"
      - "pericia.html"
      - "css/laboratorio-forense.css"
      - "js/laboratorio-forense.js"
      - "tests/laboratorio-forense.test.cjs"
      - "css/pericia-trilha.css"
      - "js/pericia-trilha.js"
      - "js/pericia-visuais.js"
      - "tests/pericia-trilha.test.cjs"
      - "tests/pericia-visuais.test.cjs"
      - ".github/workflows/test-laboratorio-forense.yml"
  push:
    branches: [main]
    paths:
      - "laboratorio-forense.html"
      - "pericia.html"
      - "css/laboratorio-forense.css"
      - "js/laboratorio-forense.js"
      - "tests/laboratorio-forense.test.cjs"
      - "css/pericia-trilha.css"
      - "js/pericia-trilha.js"
      - "js/pericia-visuais.js"
      - "tests/pericia-trilha.test.cjs"
      - "tests/pericia-visuais.test.cjs"
      - ".github/workflows/test-laboratorio-forense.yml"

permissions:
  contents: read

jobs:
  valida-laboratorios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar sintaxe JavaScript
        run: |
          node --check js/laboratorio-forense.js
          node --check js/pericia-trilha.js
          node --check js/pericia-visuais.js
      - name: Testar comparações de 64 combinações e cenas
        run: node --test tests/laboratorio-forense.test.cjs tests/pericia-trilha.test.cjs tests/pericia-visuais.test.cjs
      - name: Verificar integração e presença dos controles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("laboratorio-forense.html").read_text()
          listing = Path("pericia.html").read_text()
          js = Path("js/laboratorio-forense.js").read_text()
          css = Path("css/laboratorio-forense.css").read_text()
          ids = ["scene-select", "check-scene", "next-scene", "scene-result", "check-trace", "check-donation", "trace-type", "reference-type", "donor-type", "recipient-type"]
          assert all('id="' + item + '"' in html for item in ids), "Faltam controles HTML"
          assert html.count('value="') >= 3
          assert 'href="laboratorio-forense.html"' in listing
          assert listing.count('class="forensic-exercises-link"') == 1, "O botão único deve aparecer na listagem"
          assert "EXERCÍCIOS INTERATIVOS" in listing, "Rótulo do botão deve estar visível"
          assert "forensic-interactive-card" not in listing, "O card antigo não pode reaparecer"
          assert "js/laboratorio-forense.js" in html
          assert "css/laboratorio-forense.css" in html
          assert "forensic-exercises-row" in listing, "Botão deve ficar fora do card"
          assert "Padrões de manchas de sangue" in html
          assert "Comparação de grupos sanguíneos" in html
          assert "A evidência <em>não conta</em>" not in html
          assert "Vestígios sob a lente" not in html
          assert "CADERNO DE OBSERVAÇÃO" not in html
          assert "Confrontar interpretação" not in html
          assert "essa opção" in js.lower()
          assert all(code in css.lower() for code in ["#1769ff", "#d8222b", "#ffd43b"])
          assert "css/laboratorio-forense.css?v=20261104-2" in html
          assert "js/laboratorio-forense.js?v=20261104-2" in html
          assert "readability" not in css or "min-height" in css
          assert "redCellsCompatible" in js and "compareForensic" in js
          assert 'id="padroes"' in html and 'id="tipagem"' in html, "Ambos laboratórios continuam disponíveis"
          assert 'id="trilha"' in html
          assert "js/pericia-trilha.js?v=20261104-3" in html
          assert "css/pericia-trilha.css?v=20261104-3" in html
          ids_game = ["quest-app", "quest-answer", "quest-next", "quest-options", "quest-feedback", "quest-finish", "quest-final-score", "quest-restart", "quest-copy", "quest-progress-bar", "quest-reset", "quest-review-toggle", "quest-review-panel", "quest-review-list", "quest-reading-list", "quest-hint", "quest-hint-text", "quest-graphic"]
          assert all('id="' + item + '"' in html for item in ids_game), "Faltam controles do desafio"
          assert html.count('data-quest-badge=') == 3, "Selos ausentes"
          game_js = Path("js/pericia-trilha.js").read_text()
          game_css = Path("css/pericia-trilha.css").read_text()
          assert 'localStorage' in game_js and 'fetch(' not in game_js, "Não usar API externa no desafio"
          assert 'Math.floor(length / 3)' in game_js, "Selos não vinculados às etapas"
          assert "reviewMistakes" in game_js and "recommendedReadings" in game_js
          assert "js/pericia-visuais.js?v=20261104-1" in html
          assert html.index("js/pericia-visuais.js") < html.index("js/pericia-trilha.js")
          visuals = Path("js/pericia-visuais.js").read_text()
          assert "CHOICE_NOTES" in visuals and "HINTS" in visuals and "VISUALS" in visuals
          assert "Por que sua alternativa foi avaliada assim" in game_js
          assert "aria-expanded" in html
          assert 'id="quest-visual-mark"' not in html
          assert "quest-review-panel" in game_css and "quest-reset-link" in game_css
          assert html.count('class="lab-follow-up"') == 2
          sitemap = Path("sitemap.xml").read_text()
          for article_id in (5, 8, 11):
            url = "https://arquivosombrio.net.br/pericia.html?id=" + str(article_id) + "</loc>"
            assert url in sitemap, "Leitura recomendada sem URL no sitemap: " + str(article_id)
          assert ".quest-badge-unlocked" in game_css
          assert 'aria-valuemax="9"' in html
          print("Desafio: 9 questões, 3 selos e links verificados")
          print("Integração HTML, JS e CSS consistente")
          PY
