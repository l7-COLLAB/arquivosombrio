name: Meu Arquivo - QA funcional
on:
  pull_request:
    paths:
      - "meu-arquivo.html"
      - "css/meu-arquivo.css"
      - "js/meu-arquivo.js"
      - "js/meu-arquivo-novels.js"
      - "js/meu-arquivo-comunidade.js"
      - "js/forum-deep-link.js"
      - "forum.html"
      - "supabase/migrations/20261103221500_member_community_notifications_tags.sql"
      - "supabase/migrations/20261103222500_blocked_member_forum_comments.sql"
      - "tests/meu-arquivo-comunidade.test.mjs"
      - "js/caso.js"
      - "tests/meu-arquivo-funcional.test.mjs"
      - ".github/workflows/meu-arquivo-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  meu-arquivo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Instalar dependencias dos testes
        run: npm ci --prefix tests --ignore-scripts
      - name: Checar sintaxe do JavaScript
        run: |
          node --check js/meu-arquivo.js
          node --check js/meu-arquivo-novels.js
          node --check js/caso.js
          node --check js/meu-arquivo-comunidade.js
          node --check js/forum-deep-link.js
      - name: Testar modais, queries, mural, destaques e novels
        run: node --test tests/meu-arquivo-funcional.test.mjs tests/meu-arquivo-comunidade.test.mjs
