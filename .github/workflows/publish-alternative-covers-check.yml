name: Garantir publicação segura de capas ilustrativas
on:
  pull_request:
    paths:
      - "js/cover-credits.js"
      - "js/novels.js"
      - "scripts/original-covers-svg.mjs"
      - "data/alternativas-originais-uploads-20261103.json"
      - "assets/capas-alternativas-direitos/**"
      - "previews/capas-uploads-originais-20261103.html"
      - "tests/upload-cover-replacement-integrity.test.mjs"
      - "js/seo-publicacao.js"
      - "scripts/build-seo-pages.py"
      - "caso.html"
      - "garimpo.html"
      - "pericia.html"
      - "lendas.html"
      - "creepypastas.html"
      - "tests/publish-alternative-covers.test.mjs"
      - ".github/workflows/publish-alternative-covers-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Conferir JS e contratos do conteúdo
        run: |
          node --check js/cover-credits.js
          node --check scripts/original-covers-svg.mjs
          node --check js/novels.js
          node --check js/seo-publicacao.js
          python3 -m py_compile scripts/build-seo-pages.py
          node --test tests/publish-alternative-covers.test.mjs tests/thirdparty-cover-remediation.test.mjs tests/upload-cover-replacement-integrity.test.mjs
      - name: Testar geração SEO do artigo
        run: python3 -m unittest discover -s tests -p 'test_build_seo_pages.py'
