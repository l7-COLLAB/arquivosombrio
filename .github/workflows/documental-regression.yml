      - '.github/workflows/documental-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressao:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe JavaScript
        run: |
          node --check js/caso.js
          node --check admin-v2/js/publication.js
      - name: Testes de documentação
        run: |
          node tests/publication-editorial-audit.mjs
          node tests/evidence-metadata.mjs
          node tests/dossier-evidence-completeness.mjs
          node tests/dossier-source-renderer.mjs
          node tests/dossier-timeline-navigation.mjs
          node tests/dossier-initial-editorial-audit.mjs
          node tests/dossier-editorial-integration-package.mjs
          node tests/dossier-chronology-normalizer.mjs
          node tests/dossier-chronology-pending-classifier.mjs
          node tests/dossier-chronology-temporal-preview.mjs
          node tests/dossier-chronology-real-temporal-preview.mjs
          node tests/dossier-chronology-segmentation-preview.mjs
          node tests/dossier-chronology-consolidated-preview.mjs
          node tests/dossier-chronology-editorial-package.mjs
          node tests/dossier-chronology-documentary-crosscheck.mjs
          node tests/dossier-chronology-crosscheck-phase520.mjs
          node tests/dossier-chronology-homologation-checklist.mjs
          node tests/dossier-editorial-approval-phase533.mjs
          node tests/dossier-chronology-document-review-phase534.mjs
          node tests/dossier-chronology-focused-review-phase535.mjs
          node tests/dossier-chronology-primary-sources-phase536.mjs
          node tests/dossier-chronology-proposals-phase537.mjs
          node tests/dossier-chronology-candidate-phase538.mjs
          node tests/dossier-chronology-validation-phase539.mjs
          node tests/dossier-chronology-homologation-phase540.mjs
          node tests/dossier-chronology-documentary-phase541.mjs
          node tests/dossier-chronology-approval-phase542.mjs
          node tests/dossier-chronology-decision-phase543.mjs
          node tests/dossier-chronology-isolated-phase544.mjs
          node tests/dossier-chronology-comparison-phase545.mjs
          node tests/dossier-chronology-decisions-phase546.mjs
          node tests/dossier-chronology-record-phase547.mjs
          node tests/dossier-chronology-validation-phase548.mjs
          node tests/dossier-chronology-workflow-phase549.mjs
          node tests/dossier-editorial-preview-phase550.mjs
          node tests/dossier-editorial-navigation-phase551.mjs
          node tests/dossier-editorial-responsive-phase552.mjs
          node tests/dossier-editorial-usability-phase554.mjs
          node tests/dossier-editorial-auth-boundary-phase555.mjs
          node tests/dossier-editorial-access-contract-phase556.mjs
          node tests/dossier-editorial-endpoint-phase557.mjs
          node tests/dossier-editorial-auth-view-phase558.mjs
          node tests/dossier-editorial-security-phase559.mjs
          node tests/dossier-editorial-cors-phase560.mjs
          node tests/dossier-editorial-http-phase561.mjs
          node tests/dossier-editorial-predeploy-phase562.mjs
          node tests/dossier-editorial-supabase-inventory-phase563.mjs
          node tests/dossier-editorial-gateway-phase564.mjs
          node tests/dossier-editorial-gateway-cors-phase565.mjs
          node tests/dossier-editorial-gateway-decision-phase566.mjs
          node tests/dossier-chronology-real-sample.mjs
      - name: Instalar navegador para homologação
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Homologar interface com dados fictícios
        run: node tests/dossier-browser-smoke.mjs
      - name: Testar prévia editorial em navegador
        run: node tests/dossier-editorial-browser-phase553.mjs
      - name: Guardar capturas para revisão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-dossie-documental
          path: |
            artifacts/documental/*.png
            artifacts/editorial/*.json
          if-no-files-found: ignore
          retention-days: 7
