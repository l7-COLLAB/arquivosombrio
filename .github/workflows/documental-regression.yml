name: Regressão documental
on:
  pull_request:
    paths:
      - 'js/caso.js'
      - 'css/caso.css'
      - 'admin-v2/js/publication.js'
      - 'admin-v2/js/editorial-identity-guard.js'
      - 'admin-v2/js/chronology-normalizer.js'
      - 'admin-v2/js/chronology-pending-classifier.js'
      - 'admin-v2/js/chronology-temporal-preview.js'
      - 'tests/dossier-source-renderer.mjs'
      - 'tests/publication-editorial-audit.mjs'
      - 'tests/evidence-metadata.mjs'
      - 'tests/dossier-evidence-completeness.mjs'
      - 'tests/dossier-browser-smoke.mjs'
      - 'tests/dossier-timeline-navigation.mjs'
      - 'tests/dossier-initial-editorial-audit.mjs'
      - 'tests/dossier-editorial-integration-package.mjs'
      - 'tests/dossier-chronology-normalizer.mjs'
      - 'tests/dossier-chronology-pending-classifier.mjs'
      - 'tests/dossier-chronology-temporal-preview.mjs'
      - 'tests/dossier-chronology-real-temporal-preview.mjs'
      - 'tests/dossier-chronology-segmentation-preview.mjs'
      - 'tests/dossier-chronology-consolidated-preview.mjs'
      - 'tests/dossier-chronology-editorial-package.mjs'
      - 'tests/dossier-chronology-documentary-crosscheck.mjs'
      - 'tests/dossier-chronology-crosscheck-phase520.mjs'
      - 'tests/dossier-chronology-homologation-checklist.mjs'
      - 'docs/checklist-homologacao-cronologias-fase5-22.json'
      - 'docs/cotejo-complementar-cronologias-fase5-20.json'
      - 'docs/cotejo-documental-cronologias-fase5-19.json'
      - 'docs/pacote-editorial-cronologias-fase5-18.json'
      - 'docs/previa-consolidada-cronologias-fase5-17.json'
      - 'docs/previa-segmentacao-cronologias-fase5-16.json'
      - 'docs/relatorio-normalizacao-acervo-fase5-9.json'
      - 'tests/dossier-chronology-real-sample.mjs'
      - 'docs/amostra-normalizacao-fase5-5.json'
      - 'docs/pacote-integracao-dyatlov-somerton-fase4-5.json'
      - 'data/caso.js'
      - '.github/workflows/documental-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressao:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe JavaScript
        run: |
          node --check js/caso.js
          node --check admin-v2/js/publication.js
      - name: Testes de documentação
        run: |
          node tests/publication-editorial-audit.mjs
          node tests/evidence-metadata.mjs
          node tests/dossier-evidence-completeness.mjs
          node tests/dossier-source-renderer.mjs
          node tests/dossier-timeline-navigation.mjs
          node tests/dossier-initial-editorial-audit.mjs
          node tests/dossier-editorial-integration-package.mjs
          node tests/dossier-chronology-normalizer.mjs
          node tests/dossier-chronology-pending-classifier.mjs
          node tests/dossier-chronology-temporal-preview.mjs
          node tests/dossier-chronology-real-temporal-preview.mjs
          node tests/dossier-chronology-segmentation-preview.mjs
          node tests/dossier-chronology-consolidated-preview.mjs
          node tests/dossier-chronology-editorial-package.mjs
          node tests/dossier-chronology-documentary-crosscheck.mjs
          node tests/dossier-chronology-crosscheck-phase520.mjs
          node tests/dossier-chronology-homologation-checklist.mjs
          node tests/dossier-chronology-real-sample.mjs
      - name: Instalar navegador para homologação
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Homologar interface com dados fictícios
        run: node tests/dossier-browser-smoke.mjs
      - name: Guardar capturas para revisão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-dossie-documental
          path: |
            artifacts/documental/*.png
            artifacts/editorial/*.json
          if-no-files-found: ignore
          retention-days: 7
