name: Gravador local de narrações
on:
  pull_request:
    paths:
      - "admin-v2/gravador-local.html"
      - "admin-v2/js/audio-editor.js"
      - "admin-v2/index.html"
      - "tests/gravador-local-contract.mjs"
      - ".github/workflows/gravador-local.yml"
  push:
    branches: [main]
    paths:
      - "admin-v2/gravador-local.html"
      - "admin-v2/js/audio-editor.js"
      - "admin-v2/index.html"
      - "tests/gravador-local-contract.mjs"
      - ".github/workflows/gravador-local.yml"
permissions:
  contents: read
jobs:
  local-recorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Contratos de gravação e privacidade
        run: node --test tests/gravador-local-contract.mjs
