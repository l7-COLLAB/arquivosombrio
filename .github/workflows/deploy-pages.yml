name: Deploy Arquivo Sombrio (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Recria o sitemap público a cada seis horas, inclusive sem novos commits.
    - cron: '17 */6 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: arquivo-pages
  cancel-in-progress: false
jobs:
  deploy:
    env:
      MAINTENANCE_MODE: 'false'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        # Include Estúdio Visual V2 in the published Pages artifact
      - uses: actions/configure-pages@v5
      - name: Prepare static files
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='supabase' --exclude='tools' --exclude='tests' --exclude='node_modules' --exclude='_site' --exclude='*.md' ./ _site/
          test -f _site/index.html
          test -f _site/admin-v2/index.html
          test -f _site/admin-v2/visual.html
          test -f _site/admin-v2/studio/index.html
          python3 scripts/build-seo-pages.py _site
          python3 scripts/build-novels-seo.py _site
          python3 scripts/audit-seo-build.py _site
          python3 scripts/audit-internal-links.py _site
          python3 scripts/audit-mobile-seo-readiness.py _site --report /tmp/arquivo-mobile-seo-report.json
          python3 scripts/build-design-preview.py _site
          if [ "$MAINTENANCE_MODE" = "true" ]; then
            python3 scripts/build-maintenance.py _site
          fi
          python3 scripts/harden-static-html.py _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
