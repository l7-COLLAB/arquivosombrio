name: Deploy Arquivo Sombrio (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: arquivo-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        # Include Estúdio Visual V2 in the published Pages artifact
      - uses: actions/configure-pages@v5
      - name: Prepare static files
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='supabase' --exclude='node_modules' --exclude='_site' --exclude='*.md' ./ _site/
          test -f _site/index.html
          test -f _site/admin-v2/index.html
          test -f _site/admin-v2/visual.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
