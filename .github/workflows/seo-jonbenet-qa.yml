name: Verificar SEO do dossiê legado JonBenét
on:
  pull_request:
    paths:
      - 'dossies/caso-jonbenet-ramsey.html'
      - 'tests/seo-jonbenet-legacy.mjs'
      - '.github/workflows/seo-jonbenet-qa.yml'
  push:
    branches: [main]
    paths:
      - 'dossies/caso-jonbenet-ramsey.html'
      - 'tests/seo-jonbenet-legacy.mjs'
      - '.github/workflows/seo-jonbenet-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/seo-jonbenet-legacy.mjs
