name: Atualizar favicons derivados

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/atualizar-favicons.yml"

permissions:
  contents: write

jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Pillow
        run: python -m pip install --quiet pillow

      - name: Gerar favicons
        env:
          FAVICON_B64: ""
        run: |
          python - <<'PY'
          import base64, os
          from PIL import Image
          raw = base64.b64decode(os.environ["FAVICON_B64"])
          with open("favicon-96.png", "wb") as f:
              f.write(raw)
          img = Image.open("favicon-96.png").convert("RGBA")
          for size in (180, 192, 512):
              out = img.resize((size, size), Image.Resampling.LANCZOS)
              out.save(f"favicon-{size}.png", optimize=True)
          PY

      - name: Publicar arquivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favicon-96.png favicon-180.png favicon-192.png favicon-512.png
          git commit -m "Atualiza conjunto de favicons"
          git push
