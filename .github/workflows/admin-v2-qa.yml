name: Verificar Admin V2
on:
  pull_request:
    paths:
      - 'admin-v2/**'
      - 'tests/admin-v2-regressions.mjs'
      - 'tests/campaign-covers-v2.mjs'
      - 'tests/campaign-cover-reliability.mjs'
      - 'supabase/functions/promote-campaign-covers/**'
      - 'supabase/functions/promote-scheduled-campaign-covers/**'
      - 'supabase/migrations/20261101140000_campaign_cover_atomic_and_retry.sql'
      - 'tests/newsletter-editor.mjs'
      - 'tests/newsletter-sender-health.mjs'
      - 'tests/newsletter-distribution.mjs'
      - 'supabase/functions/newsletter-dispatch/**'
      - 'supabase/functions/newsletter-webhook/**'
      - 'tests/newsletter-dispatch.mjs'
      - 'tests/newsletter-monitor.mjs'
      - 'tests/newsletter-activation.mjs'
      - 'supabase/functions/newsletter-activation/**'
      - 'supabase/functions/newsletter-monitor/**'
      - 'descadastrar-newsletter.html'
      - 'supabase/functions/newsletter-distribution/**'
      - 'supabase/migrations/20261101_newsletter_*.sql'
      - 'supabase/functions/editorial-participation/index.ts'
      - 'supabase/migrations/20261031_newsletter_editorial_editions.sql'
      - '.github/workflows/admin-v2-qa.yml'
  push:
    branches: [main]
    paths:
      - 'admin-v2/**'
      - 'tests/admin-v2-regressions.mjs'
      - 'tests/campaign-covers-v2.mjs'
      - 'tests/campaign-cover-reliability.mjs'
      - 'supabase/functions/promote-campaign-covers/**'
      - 'supabase/functions/promote-scheduled-campaign-covers/**'
      - 'supabase/migrations/20261101140000_campaign_cover_atomic_and_retry.sql'
      - 'tests/newsletter-editor.mjs'
      - 'tests/newsletter-sender-health.mjs'
      - 'tests/newsletter-distribution.mjs'
      - 'supabase/functions/newsletter-dispatch/**'
      - 'supabase/functions/newsletter-webhook/**'
      - 'tests/newsletter-dispatch.mjs'
      - 'tests/newsletter-monitor.mjs'
      - 'tests/newsletter-activation.mjs'
      - 'supabase/functions/newsletter-activation/**'
      - 'supabase/functions/newsletter-monitor/**'
      - 'descadastrar-newsletter.html'
      - 'supabase/functions/newsletter-distribution/**'
      - 'supabase/migrations/20261101_newsletter_*.sql'
      - 'supabase/functions/editorial-participation/index.ts'
      - 'supabase/migrations/20261031_newsletter_editorial_editions.sql'
      - '.github/workflows/admin-v2-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar scripts e contratos do Admin V2
        run: |
          node --test tests/admin-v2-regressions.mjs
          node --check admin-v2/js/campanhas-editor.js
          node --test tests/campaign-covers-v2.mjs
          node --test tests/campaign-cover-reliability.mjs
          node --check admin-v2/js/newsletter-editor.js
          node --test tests/newsletter-editor.mjs
          node --check admin-v2/js/newsletter-sender-health.js
          node --test tests/newsletter-sender-health.mjs
          node --check admin-v2/js/newsletter-distribution.js
          node --test tests/newsletter-distribution.mjs
          node --check admin-v2/js/newsletter-send.js
          node --test tests/newsletter-dispatch.mjs
          node --check admin-v2/js/newsletter-monitor.js
          node --test tests/newsletter-monitor.mjs
          node --check admin-v2/js/newsletter-activation.js
          node --test tests/newsletter-activation.mjs
