name: Verificar Admin V2
on:
  pull_request:
    paths:
      - 'admin-v2/**'
      - 'tests/admin-v2-regressions.mjs'
      - 'tests/newsletter-editor.mjs'
      - 'tests/newsletter-sender-health.mjs'
      - 'supabase/functions/editorial-participation/index.ts'
      - 'supabase/migrations/20261031_newsletter_editorial_editions.sql'
      - '.github/workflows/admin-v2-qa.yml'
  push:
    branches: [main]
    paths:
      - 'admin-v2/**'
      - 'tests/admin-v2-regressions.mjs'
      - 'tests/newsletter-editor.mjs'
      - 'tests/newsletter-sender-health.mjs'
      - 'supabase/functions/editorial-participation/index.ts'
      - 'supabase/migrations/20261031_newsletter_editorial_editions.sql'
      - '.github/workflows/admin-v2-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar scripts e contratos do Admin V2
        run: |
          node --test tests/admin-v2-regressions.mjs
          node --check admin-v2/js/newsletter-editor.js
          node --test tests/newsletter-editor.mjs
          node --check admin-v2/js/newsletter-sender-health.js
          node --test tests/newsletter-sender-health.mjs
