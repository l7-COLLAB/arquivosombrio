name: Verificar desempenho móvel
on:
  pull_request:
    paths:
      - 'index.html'
      - 'dossies.html'
      - 'garimpo.html'
      - 'pericia.html'
      - 'lendas.html'
      - 'creepypastas.html'
      - 'tests/public-mobile-performance.mjs'
      - '.github/workflows/public-mobile-performance.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'dossies.html'
      - 'garimpo.html'
      - 'pericia.html'
      - 'lendas.html'
      - 'creepypastas.html'
      - 'tests/public-mobile-performance.mjs'
      - '.github/workflows/public-mobile-performance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar fontes, scripts e imagem editorial
        run: node --test tests/public-mobile-performance.mjs
