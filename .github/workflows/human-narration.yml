name: Estúdio de narração humana — validação
on:
  pull_request:
    paths:
      - 'admin-v2/js/human-narration.js'
      - 'admin-v2/js/narration.js'
      - 'admin-v2/index.html'
      - 'supabase/functions/human-narration-studio/index.ts'
      - 'supabase/functions/public-narration/index.ts'
      - 'sql/human_narration_parts_20261103.sql'
      - 'tests/human-narration-contract.mjs'
      - '.github/workflows/human-narration.yml'
  workflow_dispatch:
jobs:
  static-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/human-narration-contract.mjs
  edge-types:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/human-narration-studio/index.ts supabase/functions/public-narration/index.ts
