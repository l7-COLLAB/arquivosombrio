  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar gerador em memória
        run: |
          python3 -m unittest discover -s tests -p 'test_build_*sitemap.py' -v
          python3 -m unittest discover -s tests -p 'test_build_seo_pages.py' -v
          python3 -m unittest discover -s tests -p 'test_build_novels_seo.py' -v
          node --check js/novels.js
          node --check tests/novels-browser.mjs
          node --test tests/novels-guest.mjs
          python3 -m unittest discover -s tests -p 'test_public_updates.py' -v
          python3 -m unittest discover -s tests -p 'test_public_indexes.py' -v
          node --check js/meu-arquivo.js
          node --check js/watchlist-public.js
          node --test tests/watchlist-public.mjs
          node --check js/editorial-participation.js
          node --check js/confirmar-inscricao.js
          node --check admin-v2/js/curadoria-ficcao.js
          node --test tests/editorial-participation.mjs
          python3 -m unittest discover -s tests -p 'test_public_listings.py' -v
          node --test tests/public-listings.mjs
          python3 -m unittest discover -s tests -p 'test_seo_internal_links.py' -v
          python3 -m unittest discover -s tests -p 'test_audit_internal_links.py' -v
          python3 -m unittest discover -s tests -p 'test_mobile_seo_readiness.py' -v
          python3 -m unittest discover -s tests -p 'test_audit_seo_build.py' -v
      - name: Testar metadados e status
        run: node --test tests/seo-dynamic.mjs
      - name: Validar endpoint real de newsletter sem dados pessoais
        run: |
          python3 - <<'PY'
          import json
          from urllib.request import Request, urlopen
          req = Request(
              "https://iuhotznurbyujzbyhizf.supabase.co/functions/v1/editorial-participation",
              data=json.dumps({"kind": "newsletter_status"}).encode(),
              headers={
                  "Origin": "https://arquivosombrio.net.br",
                  "Content-Type": "application/json",
                  "apikey": "sb_publishable_bpAZ5EhYLIuVoE4Q97s_-A_XQwwRxUj",
              },
              method="POST",
          )
          with urlopen(req, timeout=20) as response:
              payload = json.load(response)
          assert payload.get("ok") is True, "Endpoint de newsletter indisponível"
          assert isinstance(payload.get("available"), bool), "Status de disponibilidade inválido"
          print("Newsletter status: pronta" if payload["available"] else "Newsletter status: bloqueada até configuração do remetente")
          PY
      - name: Validar consulta pública real e sitemap de deploy
        run: |
          mkdir -p /tmp/arquivo-sombrio-sitemap-test
          cp participar.html indices.html atualizacoes.html sitemap.xml pesquisa.html index.html dossies.html pericia.html forum.html garimpo.html lendas.html creepypastas.html /tmp/arquivo-sombrio-sitemap-test/
          python3 scripts/build-seo-pages.py /tmp/arquivo-sombrio-sitemap-test
          python3 scripts/build-novels-seo.py /tmp/arquivo-sombrio-sitemap-test
          python3 -c 'from xml.etree import ElementTree as ET; r=ET.parse("/tmp/arquivo-sombrio-sitemap-test/rss.xml").getroot(); assert r.tag=="rss" and len(r.findall("channel/item"))>0, "RSS vazio"'
          python3 scripts/audit-seo-build.py /tmp/arquivo-sombrio-sitemap-test --report /tmp/seo-audit-report.json
          python3 scripts/audit-internal-links.py /tmp/arquivo-sombrio-sitemap-test --report /tmp/internal-links-report.json
          python3 scripts/audit-mobile-seo-readiness.py /tmp/arquivo-sombrio-sitemap-test --report /tmp/mobile-seo-report.json
          python3 -c 'from xml.etree import ElementTree as ET; root=ET.parse("/tmp/arquivo-sombrio-sitemap-test/sitemap.xml").getroot(); assert len(root)>21, "Sitemap não inclui publicações"'

  browser-smoke:
    name: Navegador real — novels desktop e mobile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Testar navegador desktop e mobile sem login
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/novels-browser-server.log 2>&1 &
          node tests/novels-browser.mjs
