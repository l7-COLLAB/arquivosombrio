name: Verificar sitemap dinâmico e SEO
on:
  pull_request:
    paths:
      - 'scripts/build-public-sitemap.py'
      - 'tests/test_build_public_sitemap.py'
      - 'tests/seo-dynamic.mjs'
      - 'scripts/build-seo-pages.py'
      - 'scripts/audit-seo-build.py'
      - 'tests/test_audit_seo_build.py'
      - 'tests/test_build_seo_pages.py'
      - 'tests/test_seo_internal_links.py'
      - 'scripts/audit-internal-links.py'
      - 'scripts/audit-mobile-seo-readiness.py'
      - 'tests/test_mobile_seo_readiness.py'
      - 'tests/test_audit_internal_links.py'
      - 'js/seo-publicacao.js'
      - 'js/caso.js'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/seo-dynamic-qa.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/build-public-sitemap.py'
      - 'tests/test_build_public_sitemap.py'
      - 'tests/seo-dynamic.mjs'
      - 'scripts/build-seo-pages.py'
      - 'scripts/audit-seo-build.py'
      - 'tests/test_audit_seo_build.py'
      - 'tests/test_build_seo_pages.py'
      - 'tests/test_seo_internal_links.py'
      - 'scripts/audit-internal-links.py'
      - 'scripts/audit-mobile-seo-readiness.py'
      - 'tests/test_mobile_seo_readiness.py'
      - 'tests/test_audit_internal_links.py'
      - 'js/seo-publicacao.js'
      - 'js/caso.js'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/seo-dynamic-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar gerador em memória
        run: |
          python3 -m unittest discover -s tests -p 'test_build_*sitemap.py' -v
          python3 -m unittest discover -s tests -p 'test_build_seo_pages.py' -v
          python3 -m unittest discover -s tests -p 'test_seo_internal_links.py' -v
          python3 -m unittest discover -s tests -p 'test_audit_internal_links.py' -v
          python3 -m unittest discover -s tests -p 'test_mobile_seo_readiness.py' -v
          python3 -m unittest discover -s tests -p 'test_audit_seo_build.py' -v
      - name: Testar metadados e status
        run: node --test tests/seo-dynamic.mjs
      - name: Validar consulta pública real e sitemap de deploy
        run: |
          mkdir -p /tmp/arquivo-sombrio-sitemap-test
          cp sitemap.xml pesquisa.html index.html dossies.html garimpo.html pericia.html lendas.html creepypastas.html /tmp/arquivo-sombrio-sitemap-test/
          python3 scripts/build-seo-pages.py /tmp/arquivo-sombrio-sitemap-test
          python3 scripts/audit-seo-build.py /tmp/arquivo-sombrio-sitemap-test --report /tmp/seo-audit-report.json
          python3 scripts/audit-internal-links.py /tmp/arquivo-sombrio-sitemap-test --report /tmp/internal-links-report.json
          python3 scripts/audit-mobile-seo-readiness.py /tmp/arquivo-sombrio-sitemap-test --report /tmp/mobile-seo-report.json
          python3 -c 'from xml.etree import ElementTree as ET; root=ET.parse("/tmp/arquivo-sombrio-sitemap-test/sitemap.xml").getroot(); assert len(root)>21, "Sitemap não inclui publicações"'
