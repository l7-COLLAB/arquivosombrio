name: Arquivo Voz - Kokoro to R2 (staging)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arquivo-voz-staging
  cancel-in-progress: false
jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: arquivo-voz-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: arquivo-voz-cloud/requirements.txt
      - name: Install worker dependencies
        run: pip install -r arquivo-voz-cloud/requirements.txt
      - name: Test narration preparation
        run: python -m unittest discover -s arquivo-voz-cloud -p 'test_*.py'
      - name: Validate required credentials
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          for key in SUPABASE_SERVICE_ROLE_KEY R2_ENDPOINT R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!key}" ]; then echo "Missing required environment secret: $key"; exit 1; fi
          done
      - name: Generate temporary Kokoro API key
        run: echo "KOKORO_API_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Start Kokoro
        run: docker run -d --name arquivo-voz-kokoro -p 127.0.0.1:8880:8880 -e KOKORO_VOICE=pf_dora -e KOKORO_LANG_CODE=p -e KOKORO_API_KEY="$KOKORO_API_KEY" hwdsl2/kokoro-server:latest
      - name: Wait for Kokoro readiness
        run: |
          for i in $(seq 1 90); do
            if curl --fail --silent -H "Authorization: Bearer $KOKORO_API_KEY" http://127.0.0.1:8880/v1/models > /dev/null; then exit 0; fi
            sleep 5
          done
          docker logs arquivo-voz-kokoro
          exit 1
      - name: Process one staging job
        env:
          SUPABASE_URL: https://iuhotznurbyujzbyhizf.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          KOKORO_URL: http://127.0.0.1:8880
          KOKORO_API_KEY: ${{ env.KOKORO_API_KEY }}
          RUN_ONCE: 'true'
        run: python -c 'import asyncio,sys;sys.path.insert(0,"arquivo-voz-cloud");from worker import loop;asyncio.run(loop())'
