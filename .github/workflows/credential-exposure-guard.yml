name: Credential exposure guard
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  credential-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan tracked files without logging credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, re, subprocess, sys
          from pathlib import Path
          patterns = {
              'Supabase secret key': rb'(?<![A-Za-z0-9_])sb_secret_[A-Za-z0-9_-]{20,}',
              'GitHub personal token': rb'(?<![A-Za-z0-9_])(?:gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{50,})',
              'AWS access key ID': rb'(?<![A-Z0-9])(?:AKIA|ASIA)[A-Z0-9]{16}(?![A-Z0-9])',
              'Private key block': rb'-----BEGIN (?:RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----',
          }
          jwt = re.compile(rb'eyJ[A-Za-z0-9_-]+\.([A-Za-z0-9_-]+)\.[A-Za-z0-9_-]+')
          def detect(data):
              findings = {label for label, pattern in patterns.items() if re.search(pattern, data)}
              for match in jwt.finditer(data):
                  try:
                      raw = match.group(1)
                      payload = json.loads(base64.urlsafe_b64decode(raw + b'=' * (-len(raw) % 4)))
                      if isinstance(payload, dict) and payload.get('role') == 'service_role':
                          findings.add('Supabase privileged JWT')
                  except (ValueError, TypeError, UnicodeError):
                      pass
              return findings
          assert not detect(b'public client config: sb_publishable_example')
          assert 'Supabase secret key' in detect(b'sb_' + b'secret_' + b'x' * 25)
          claims = base64.urlsafe_b64encode(json.dumps({'role':'service_role'}).encode()).rstrip(b'=')
          assert 'Supabase privileged JWT' in detect(b'eyJfake.' + claims + b'.signature')
          paths = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          flagged = []
          for raw in filter(None, paths):
              path = Path(raw.decode('utf-8', errors='surrogateescape'))
              if path.is_symlink() or not path.is_file():
                  continue
              findings = detect(path.read_bytes())
              if findings:
                  flagged.append((str(path), ', '.join(sorted(findings))))
          for path, kinds in flagged:
              print(f'{path!r}: {kinds}')
          print(f'Scan complete; {len(flagged)} file(s) flagged. Values are never logged.')
          sys.exit(bool(flagged))
          PY
