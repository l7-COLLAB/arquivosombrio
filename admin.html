<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Administração — Arquivo Sombrio</title>
    <link rel="icon" type="image/png" href="favicon-32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style-base-20260914.css?v=20260917-6">
    <link rel="stylesheet" href="css/style.css?v=20260917-6">
    <style>
        #modal-admin {
            display: flex;
            visibility: visible;
            opacity: 1;
            pointer-events: auto;
        }

        .admin-login-back {
            position: absolute;
            top: 18px;
            right: 18px;
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            color: var(--muted);
            border: 1px solid var(--border);
            text-decoration: none;
            font-size: 1.15rem;
        }

        .admin-login-back:hover,
        .admin-login-back:focus-visible {
            color: var(--paper);
            border-color: var(--red-light);
        }
    </style>
</head>
<body>
    <main>
        <div
            class="modal-overlay active"
            id="modal-admin"
            role="dialog"
            aria-modal="true"
            aria-labelledby="admin-modal-title"
            aria-describedby="admin-modal-description"
        >
            <div class="modal-card">
                <a class="admin-login-back" href="index.html" aria-label="Voltar ao início">&times;</a>

                <span class="modal-label">ACESSO RESTRITO</span>

                <div class="modal-icon">
                    <i class="fa-solid fa-user-shield"></i>
                </div>

                <h1 id="admin-modal-title">Central de Arquivo</h1>

                <p id="admin-modal-description">
                    Insira a credencial administrativa para acessar as ferramentas de gerenciamento.
                </p>

                <form id="form-admin-login">
                    <div class="form-row">
                        <label for="admin-email">E-MAIL ADMINISTRATIVO</label>
                        <input
                            type="email"
                            id="admin-email"
                            placeholder="Digite seu e-mail"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="form-row">
                        <label for="admin-pass">SENHA</label>
                        <input
                            type="password"
                            id="admin-pass"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button type="submit" class="btn-primary btn-form">
                        <i class="fa-solid fa-unlock-keyhole"></i>
                        Acessar Painel
                    </button>

                    <p
                        id="admin-login-erro"
                        class="form-message error-message"
                        role="alert"
                        aria-live="assertive"
                    ></p>
                </form>

                <noscript>Ative o JavaScript para acessar a área administrativa.</noscript>
            </div>
        </div>
    </main>

    <script src="data/caso.js" defer></script>
    <script src="js/script.js?v=20260917-6" defer></script>
</body>
</html>
