<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Administração — Arquivo Sombrio</title>
    <link rel="icon" type="image/png" href="favicon-32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style-base-20260914.css?v=20260917-6">
    <link rel="stylesheet" href="css/style.css?v=20260917-6">
    <style>
        #modal-admin:not(.active),
        #modal-admin[hidden] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        body.admin-dashboard-open {
            min-height: 100dvh;
            overflow: auto !important;
            background: #080706;
        }

        body.admin-dashboard-open > main {
            display: none !important;
        }

        body.admin-dashboard-open #admin-manager.admin-manager-overlay.active {
            position: relative !important;
            inset: auto !important;
            display: block !important;
            width: 100% !important;
            height: auto !important;
            min-height: 100dvh !important;
            max-height: none !important;
            padding: max(12px, env(safe-area-inset-top)) 8px max(32px, env(safe-area-inset-bottom)) !important;
            overflow: visible !important;
            visibility: visible !important;
            opacity: 1 !important;
            background: #080706 !important;
        }

        body.admin-dashboard-open #admin-manager > .admin-manager {
            display: block !important;
            position: relative !important;
            width: min(100%, 1120px) !important;
            min-height: 420px !important;
            max-height: none !important;
            margin: 0 auto !important;
            overflow: visible !important;
            visibility: visible !important;
            opacity: 1 !important;
        }

        body.admin-dashboard-open #admin-manager-close {
            display: none !important;
        }

        .admin-login-back {
            position: absolute;
            top: 18px;
            right: 18px;
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            color: var(--muted);
            border: 1px solid var(--border);
            text-decoration: none;
            font-size: 1.15rem;
        }

        .admin-login-back:hover,
        .admin-login-back:focus-visible {
            color: var(--paper);
            border-color: var(--red-light);
        }

        .admin-captcha-area {
            margin: 18px 0;
            padding: 16px;
            border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.22);
        }

        #admin-turnstile {
            min-height: 65px;
            display: flex;
            justify-content: flex-start;
        }

        #admin-captcha-status {
            margin: 10px 0 0;
            color: var(--muted);
            font-family: var(--font-mono);
            font-size: 0.64rem;
        }

        #admin-submit:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <main>
        <div
            class="modal-overlay active"
            id="modal-admin"
            role="dialog"
            aria-modal="true"
            aria-labelledby="admin-modal-title"
            aria-describedby="admin-modal-description"
        >
            <div class="modal-card">
                <a class="admin-login-back" href="index.html" aria-label="Voltar ao início">&times;</a>

                <span class="modal-label">ACESSO RESTRITO</span>

                <div class="modal-icon">
                    <i class="fa-solid fa-user-shield"></i>
                </div>

                <h1 id="admin-modal-title">Central de Arquivo</h1>

                <p id="admin-modal-description">
                    Insira a credencial administrativa para acessar as ferramentas de gerenciamento.
                </p>

                <form id="form-admin-login">
                    <div class="form-row">
                        <label for="admin-email">E-MAIL ADMINISTRATIVO</label>
                        <input
                            type="email"
                            id="admin-email"
                            placeholder="Digite seu e-mail"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="form-row">
                        <label for="admin-pass">SENHA</label>
                        <input
                            type="password"
                            id="admin-pass"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <div class="admin-captcha-area">
                        <div
                            id="admin-turnstile"
                            class="cf-turnstile"
                            data-sitekey="0x4AAAAAAEnNLBi2BDt_aJkF"
                            data-theme="dark"
                            data-language="pt-BR"
                            data-callback="arquivoAdminCaptchaConcluido"
                            data-error-callback="arquivoAdminCaptchaErro"
                            data-expired-callback="arquivoAdminCaptchaExpirado"
                            data-timeout-callback="arquivoAdminCaptchaErro"
                        ></div>
                        <p id="admin-captcha-status" role="status" aria-live="polite">
                            Conclua a verificação de segurança para liberar o acesso.
                        </p>
                    </div>

                    <button type="submit" class="btn-primary btn-form" id="admin-submit" disabled>
                        <i class="fa-solid fa-unlock-keyhole"></i>
                        Acessar Painel
                    </button>

                    <p
                        id="admin-login-erro"
                        class="form-message error-message"
                        role="alert"
                        aria-live="assertive"
                    ></p>
                </form>

                <noscript>Ative o JavaScript para acessar a área administrativa.</noscript>
            </div>
        </div>
    </main>

    <script>
        window.ARQUIVO_ADMIN_CAPTCHA_ATIVO = true;
        window.ARQUIVO_ADMIN_CAPTCHA_TOKEN = "";

        window.arquivoAdminCaptchaConcluido = function (token) {
            window.ARQUIVO_ADMIN_CAPTCHA_TOKEN = token || "";
            var botao = document.getElementById("admin-submit");
            var status = document.getElementById("admin-captcha-status");
            if (botao) botao.disabled = !window.ARQUIVO_ADMIN_CAPTCHA_TOKEN;
            if (status) status.textContent = window.ARQUIVO_ADMIN_CAPTCHA_TOKEN
                ? "Verificação concluída. O acesso foi liberado."
                : "A verificação não retornou um token válido.";
        };

        window.arquivoAdminCaptchaErro = function () {
            window.ARQUIVO_ADMIN_CAPTCHA_TOKEN = "";
            var botao = document.getElementById("admin-submit");
            var status = document.getElementById("admin-captcha-status");
            if (botao) botao.disabled = true;
            if (status) status.textContent = "Não foi possível carregar a verificação. Atualize a página e tente novamente.";
        };

        window.arquivoAdminCaptchaExpirado = function () {
            window.ARQUIVO_ADMIN_CAPTCHA_TOKEN = "";
            var botao = document.getElementById("admin-submit");
            var status = document.getElementById("admin-captcha-status");
            if (botao) botao.disabled = true;
            if (status) status.textContent = "A verificação expirou. Marque a caixa novamente.";
        };

        window.arquivoAdminCaptchaReset = function () {
            window.arquivoAdminCaptchaExpirado();
            if (window.turnstile) {
                try { window.turnstile.reset(); } catch (erro) { console.warn(erro); }
            }
        };
    </script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"
        data-arquivo-sombrio-supabase="true"
        defer
    ></script>
    <script src="data/caso.js" defer></script>
    <script src="js/script.js?v=20260918-12" defer></script>
    <script src="js/admin-literario.js?v=20260917-7" defer></script>
    <script src="js/admin-core-tabs.js?v=20260917-7" defer></script>
</body>
</html>
