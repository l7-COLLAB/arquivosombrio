<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arquivo Voz Mobile</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{background:#121417;color:#ebe7dd;font:16px system-ui,-apple-system,sans-serif;margin:0}main{max-width:680px;padding:26px 18px;margin:auto}h1{font-family:Georgia,serif;font-weight:normal;font-size:32px;margin:8px 0}p,small{color:#b5b2ab}label{display:block;margin:16px 0 7px;font-size:13px;letter-spacing:.05em}input,textarea,select,button{width:100%;border-radius:9px;font:inherit;padding:12px;border:1px solid #484948;background:#1e2024;color:#fff}textarea{min-height:240px;resize:vertical;line-height:1.6}button{background:#a58e69;color:#151515;border:0;font-weight:bold;margin-top:18px;cursor:pointer}button:disabled{opacity:.55}audio{width:100%;margin:20px 0}a{color:#e0c397}#result{display:none}#status{min-height:22px}#app{display:none}</style></head><body><main>
<small>ARQUIVO SOMBRIO · ADMINISTRAÇÃO</small><h1>Arquivo Voz Mobile</h1><p>Geração de áudio por Edge TTS. Revise a narração antes de enviar ao site.</p>
<section id="login"><label>E-mail de administrador</label><input id="email" type="email" autocomplete="username"><label>Senha</label><input id="password" type="password" autocomplete="current-password"><button id="enter">Entrar</button></section>
<section id="app"><button id="logout" style="background:transparent;color:#ddd;border:1px solid #555">Sair da conta</button><label>Texto adaptado</label><textarea id="script" placeholder="Cole aqui a narração completa..."></textarea><small id="counter">0 caracteres</small><label>Voz</label><select id="voice"><option value="pt-BR-FranciscaNeural">Francisca · feminina</option><option value="pt-BR-AntonioNeural">Antônio · masculina</option></select><label>Velocidade</label><select id="rate"><option value="-15">Mais lenta</option><option value="-5">Levemente lenta</option><option value="0" selected>Normal</option><option value="10">Mais rápida</option></select><button id="generate">Gerar MP3</button><div id="result"><audio id="player" controls></audio><a id="download" download="arquivo-voz.mp3">Baixar MP3</a></div></section><p id="status" role="status"></p>
</main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const $=s=>document.querySelector(s);let sb=null,url=null;
const say=s=>{$('#status').textContent=s};
try{const r=await fetch('/config');if(!r.ok)throw Error();const c=await r.json();sb=createClient(c.supabase_url,c.supabase_anon_key,{auth:{persistSession:false,autoRefreshToken:false}})}catch{say('Servidor ainda não configurado.')}
$('#script').oninput=()=>$('#counter').textContent=$('#script').value.length+' caracteres';
$('#enter').onclick=async()=>{if(!sb)return;$('#enter').disabled=true;try{const {error}=await sb.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});if(error)throw error;$('#login').style.display='none';$('#app').style.display='block';say('Sessão iniciada.')}catch{say('Não foi possível entrar. Confira suas credenciais administrativas.')}finally{$('#enter').disabled=false}};
$('#logout').onclick=async()=>{await sb?.auth.signOut();$('#app').style.display='none';$('#login').style.display='block';say('Sessão encerrada.')};
$('#generate').onclick=async()=>{const btn=$('#generate');btn.disabled=true;$('#result').style.display='none';say('Gerando MP3. Não feche a página.');try{const {data}=await sb.auth.getSession();if(!data.session)throw Error('Faça login novamente.');const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+data.session.access_token},body:JSON.stringify({text:$('#script').value,voice:$('#voice').value,rate:Number($('#rate').value)})});if(!r.ok){let j=await r.json().catch(()=>({}));throw Error(j.detail||'Falha de geração');}const blob=await r.blob();if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);$('#player').src=url;$('#download').href=url;$('#result').style.display='block';say('MP3 gerado. Ouça antes de baixar.')}catch(e){say(e.message||'Falha ao gerar áudio')}finally{btn.disabled=false}};
</script></body></html>
